<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나무타기 시작 카운트다운 데모</title>
<style>
  :root { --green: #00a69c; }
  body { margin: 0; font-family: Pretendard, -apple-system, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #fff; color: #212529; }
  body.dark { background: #1b1b1d; color: #e0e0e0; }
  /* 아래는 나무위키 화면을 흉내 낸 배경이다. 진짜 효과는 .cd 하나뿐. */
  .bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: linear-gradient(to right, #00a69c, #00a69c, #28b472); color: #fff;
         font-size: 14px; padding: 8px 14px; border-radius: 6px; white-space: nowrap; display: flex; gap: 14px; align-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  body.dark .bar { background: #2e3033; }
  .bar b { font-variant-numeric: tabular-nums; }
  .page { max-width: 720px; margin: 90px auto 40px; padding: 0 20px; line-height: 1.7; }
  .page h1 { font-size: 34px; margin: 0 0 6px; }
  .page .ln { height: 12px; border-radius: 6px; background: currentColor; opacity: .09; margin: 14px 0; }
  .ctl { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; z-index: 20; }
  .ctl button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 5px; border: 1px solid #aaa; background: #fff; color: #222; cursor: pointer; }
  .ctl button.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }

  /* ---- 카운트다운 오버레이: 화면 전체, 뒷배경 50% 어둡게 ---- */
  .cd { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.5); display: none; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; user-select: none; text-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .cd.on { display: flex; }
  .cd.out { animation: fade .45s ease-in both; }
  .cd small { font-size: clamp(14px, 1.6vw, 18px); font-weight: 600; min-height: 1.4em; }
  .cd b { font-size: clamp(48px, 7vw, 90px); line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cd b.pop { animation: pop .8s ease-out both; }
  .cd b.go { color: #3ddc97; animation: go .7s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { 0% { transform: scale(1.7); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(.88); opacity: 0; } }
  @keyframes go { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fade { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cd b.pop, .cd b.go { animation: none; } .cd.out { animation-duration: .01s; } }
</style>
<div class="bar">목표 <b>배(과일)</b> 단계 <b>0</b> <b id="t">00:00.00</b></div>
<div class="page"><h1>사과</h1><div class="ln"></div><div class="ln" style="width:92%"></div><div class="ln" style="width:97%"></div><div class="ln" style="width:70%"></div>
  <div class="ln"></div><div class="ln" style="width:88%"></div><div class="ln" style="width:95%"></div><div class="ln" style="width:60%"></div></div>
<div class="cd" id="cd"><small id="msg"></small><b id="num"></b></div>
<div class="ctl"><button class="primary" id="again">다시 보기</button><button id="theme">나무위키 다크로 보기</button></div>
<script>
  const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
  let running = false, t0 = 0;
  const show = (text, cls) => { const n = $('num'); n.className = ''; void n.offsetWidth; n.textContent = text; n.className = cls; }; // 클래스를 뺐다 다시 넣어 애니메이션을 되감는다
  const tick = () => { if (t0) { const cs = Math.floor((performance.now() - t0) / 10); $('t').textContent = String(Math.floor(cs / 6000)).padStart(2, '0') + ':' + String(Math.floor(cs / 100) % 60).padStart(2, '0') + '.' + String(cs % 100).padStart(2, '0'); } requestAnimationFrame(tick); };
  tick();
  async function run() {
    if (running) return; running = true; t0 = 0; $('t').textContent = '00:00.00';
    $('cd').className = 'cd on'; $('msg').textContent = '준비됐나요?'; $('num').textContent = '';
    await sleep(1000);
    for (const n of [3, 2, 1]) { show(n, 'pop'); await sleep(800); }
    show('시작!', 'go'); $('msg').textContent = ''; t0 = performance.now(); // 시간은 "시작!"이 뜨는 순간부터
    await sleep(700);
    $('cd').classList.add('out'); await sleep(450); $('cd').className = 'cd'; running = false;
  }
  $('again').onclick = run;
  $('theme').onclick = () => { document.body.classList.toggle('dark'); $('theme').textContent = document.body.classList.contains('dark') ? '나무위키 라이트로 보기' : '나무위키 다크로 보기'; };
  run();
</script>
